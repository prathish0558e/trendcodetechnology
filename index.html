<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta

      content="Trend Code Technology builds software, websites, mobile apps and digital solutions for businesses in Coimbatore and across India."
    />
    <meta name="robots" content="noindex, nofollow" />

    <meta name="geo.region" content="IN-TN" />
    <meta name="geo.placename" content="Coimbatore" />
    <link rel="icon" type="image/png" href="/tct-logo.png" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trend Code Technology" />
    <meta property="og:title" content="Trend Code Technology | Software & IT Services in Coimbatore" />
    <meta
      property="og:description"
      content="Trend Code Technology builds software, websites, mobile apps and digital solutions for businesses in Coimbatore and across India."
    />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Entry loading animation — inline so it paints before the JS bundle
         arrives. Light blue + orange on white, dismissed from the script at
         the end of <body>. -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(46% 42% at 12% 6%, rgba(13, 110, 253, 0.09), transparent 62%),
          radial-gradient(42% 38% at 90% 94%, rgba(249, 115, 22, 0.1), transparent 62%),
          #ffffff;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #boot-loader.bl-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .bl-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 0 20px;
      }
      .bl-orbit {
        position: relative;
        width: 112px;
        height: 112px;
        display: grid;
        place-items: center;
      }
      .bl-arc {
        position: absolute;
        border-radius: 50%;
        border: 4px solid transparent;
      }
      .bl-arc-blue {
        inset: 0;
        border-top-color: #0d6efd;
        border-right-color: #0d6efd;
        animation: bl-spin 1.1s linear infinite;
      }
      .bl-arc-orange {
        inset: 15px;
        border-bottom-color: #f97316;
        border-left-color: #f97316;
        animation: bl-spin 1.6s linear infinite reverse;
      }
      .bl-tile {
        width: 78px;
        height: 78px;
        display: grid;
        place-items: center;
      }
      .bl-logo {
        width: 68px;
        height: auto;
        object-fit: contain;
        border-radius: 50%;
      }
      .bl-brand {
        margin: 0;
        font: 700 12.5px/1.5 "Inter", system-ui, sans-serif;
        letter-spacing: 0.3em;
        color: #0e1726;
        text-align: center;
      }
      .bl-sub {
        margin: -10px 0 0;
        font: 500 10.5px/1.5 "Inter", system-ui, sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #64748b;
        text-align: center;
      }
      .bl-bar {
        position: relative;
        width: 208px;
        max-width: 74vw;
        height: 5px;
        border-radius: 999px;
        background: #e9f1fe;
        overflow: hidden;
      }
      /* the bar always reads as complete — the sweep is only polish, so this
         still looks right when animations are paused or throttled */
      .bl-bar span {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #0d6efd 0%, #38bdf8 48%, #f97316 100%);
      }
      .bl-bar span::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 42%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
        animation: bl-sweep 1.4s ease-in-out infinite;
      }
      @keyframes bl-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes bl-sweep {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(330%); }
      }
      @media (max-width: 480px) {
        .bl-brand { font-size: 10.5px; letter-spacing: 0.22em; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bl-arc-blue,
        .bl-arc-orange,
        .bl-bar span::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite" aria-label="Loading Trend Code Technology">
      <div class="bl-wrap">
        <div class="bl-orbit">
          <span class="bl-arc bl-arc-blue"></span>
          <span class="bl-arc bl-arc-orange"></span>
          <span class="bl-tile">
            <img class="bl-logo" src="/tct-logo.png" alt="Trend Code Technology" />
          </span>
        </div>
        <p class="bl-brand">TREND CODE TECHNOLOGY</p>
        <p class="bl-sub">Coimbatore · Since 2019</p>
        <div class="bl-bar"><span></span></div>
      </div>
    </div>
    <noscript><style>#boot-loader { display: none; }</style></noscript>
    <div id="root"></div>
    <script>
      /* Dismiss the entry animation: at least 1.5s so it can be seen, never
         longer than 2.6s so it can never hold the page hostage. */
      (function () {
        var el = document.getElementById("boot-loader");
        if (!el) return;
        var start = Date.now();
        var MIN = 1500;
        var MAX = 2600;
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          el.classList.add("bl-hide");
          window.setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 750);
        }
        function soon() {
          window.setTimeout(hide, Math.max(0, MIN - (Date.now() - start)));
        }
        if (document.readyState === "complete") soon();
        else window.addEventListener("load", soon);
        window.setTimeout(hide, MAX);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
